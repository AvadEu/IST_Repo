services:
  bot:
    build: .
    env_file: .env
    environment:
      # zegar kontenera = czas lokalny, żeby pasował do godzin wpisywanych
      # w komendach (porównanie remind_at <= datetime.now() w schedulerze)
      TZ: ${TZ:-Europe/Warsaw}
    ports:
      - "8000:8000"
    volumes:
      - db_data:/data
      - audio_data:/data/audio
    restart: unless-stopped

volumes:
  db_data:
  audio_data:
