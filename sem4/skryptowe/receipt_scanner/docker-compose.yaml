services:
  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-receipts}
      MARIADB_USER: ${DB_USER:-receipts}
      MARIADB_PASSWORD: ${DB_PASSWORD:-receipts}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpass}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      UPLOAD_DIR: ${UPLOAD_DIR:-/uploads}
    volumes:
      - uploads_data:/uploads
    depends_on:
      mariadb:
        condition: service_healthy
    expose:
      - "8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mariadb_data:
  uploads_data:
