<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Receipt Scanner</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .stat { font-size: 1.6rem; font-weight: 700; color: var(--primary); }
    .stat-label { color: var(--muted); font-size: 0.85rem; text-transform: uppercase; }
    .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 720px) { .charts { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <nav>
    <a href="upload.html">Upload</a>
    <a href="receipts.html">Paragony</a>
    <a href="dashboard.html" class="active">Dashboard</a>
  </nav>
  <main>
    <h1>Dashboard</h1>

    <div id="empty" class="empty" hidden>Brak danych — dodaj pierwszy paragon.</div>

    <div id="content" hidden>
      <div class="cards">
        <div class="card">
          <div class="stat-label">Łączne wydatki</div>
          <div class="stat" id="totalSpent">—</div>
        </div>
        <div class="card">
          <div class="stat-label">Liczba paragonów</div>
          <div class="stat" id="receiptCount">—</div>
        </div>
        <div class="card">
          <div class="stat-label">Największa kategoria</div>
          <div class="stat" id="topCategory">—</div>
        </div>
        <div class="card">
          <div class="stat-label">Wydatki w tym miesiącu</div>
          <div class="stat" id="currentMonth">—</div>
        </div>
      </div>

      <div class="charts">
        <div class="card">
          <h3>Wydatki wg kategorii</h3>
          <canvas id="categoryChart"></canvas>
        </div>
        <div class="card">
          <h3>Wydatki wg miesiąca</h3>
          <canvas id="monthChart"></canvas>
        </div>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
