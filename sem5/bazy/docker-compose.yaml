name: dev-databases

services:
  postgres:
    image: postgres:18.6
    container_name: pg18
    pull_policy: missing        # only pull if the image isn't already local
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: zaq1@WSX
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql   # PG 18+ images use this path, not .../data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d appdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  oracle:
    image: gvenzl/oracle-free:23     # Oracle Database Free (26ai = 23.26.x), native arm64
    container_name: oracle26ai
    pull_policy: missing
    restart: unless-stopped
    environment:
      ORACLE_PASSWORD: zaq1@WSX   # password for SYS/SYSTEM
      APP_USER: appuser
      APP_USER_PASSWORD: zaq1@WSX
    ports:
      - "1521:1521"
    volumes:
      - oracle_data:/opt/oracle/oradata
    shm_size: 1g
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  mssql:
    image: mcr.microsoft.com/mssql/server:2025-latest
    platform: linux/amd64            # no arm64 image exists, runs under emulation
    container_name: mssql2025
    pull_policy: missing
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: zaq1@WSX
      MSSQL_MEMORY_LIMIT_MB: "2048"
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql

volumes:
  pg_data:
  oracle_data:
  mssql_data: